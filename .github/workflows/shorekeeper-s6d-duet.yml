name: Shorekeeper S6-D private shared stage QA
on:
  push:
    branches: ['experiment/shorekeeper-r623-s6d-private-duet-20261106']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-duet-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Verify S6-D changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=0d8c8dc26e97a00e704103179f9833f60dd587bc
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          if git diff --name-only "$BASE" HEAD | grep -Ev '^(src/scripts/hsin-stage\.ts|src/scripts/shorekeeper/s6-duet-guest\.mjs|src/pages/experimentos/duo/index\.astro|tests/shorekeeper-s6-duet-guest\.test\.mjs|tests/shorekeeper-s6-duo-stage-contract\.test\.mjs|docs/shorekeeper-s6d/.*|\.github/workflows/shorekeeper-s6d-duet\.yml)$'; then
            echo 'Source scope violation'; exit 1
          fi
      - name: S6-D protected guest, single-stage contracts
        run: node --test tests/shorekeeper-s6-duet-guest.test.mjs tests/shorekeeper-s6-duo-stage-contract.test.mjs
      - name: Shorekeeper regression and previous S6
        run: node --test tests/shorekeeper*.test.mjs
      - name: All repository Node tests
        run: node --test tests/*.test.mjs
      - name: check
        run: npm run check
      - name: build
        run: npm run build
      - name: Reject private asset leakage
        shell: bash
        run: |
          if find dist -type f \( -iname 'shorekeeper-f20a*.glb' -o -iname 'basic*.glb' -o -iname 'advanced*.glb' -o -iname 'burst*.glb' \) | grep .; then
            echo 'PRIVATE_ASSET_LEAK'; exit 1
          fi
          test -f dist/experimentos/duo/index.html
          grep -qi 'noindex' dist/experimentos/duo/index.html
          echo 'Private-stage build completed; authenticated GPU and R2 inputs remain pending.'
