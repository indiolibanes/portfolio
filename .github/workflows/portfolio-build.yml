name: Portfolio build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Music → Hsin transition contract
        run: node tests/music-experimental-transition.test.mjs

      - name: Hsin V2.0.1 lunar runtime
        run: |
          node tests/hsin-lunar-terrace.test.mjs
          node tests/hsin-lunar-refinement.test.mjs

      - name: Build production site
        run: npm run build

      - name: Verify built Hsin scenery
        run: |
          HSIN_CHECK_DIST=1 node tests/hsin-lunar-terrace.test.mjs
          HSIN_CHECK_DIST=1 node tests/hsin-lunar-refinement.test.mjs
