name: Portfolio build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Source and runtime regression checks
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Verify built Hsin scenery
        run: |
          HSIN_CHECK_DIST=1 node tests/hsin-lunar-terrace.test.mjs
          HSIN_CHECK_DIST=1 node tests/hsin-lunar-refinement.test.mjs
