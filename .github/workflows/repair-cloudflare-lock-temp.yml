name: Repair Cloudflare npm lockfile (temporary)

on:
  push:
    branches:
      - fix/cloudflare-npm-lock-2026-10-30
    paths:
      - .github/workflows/repair-cloudflare-lock-temp.yml

permissions:
  contents: write

concurrency:
  group: repair-portfolio-lockfile
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup same Node as Cloudflare Pages
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Regenerate npm lock metadata only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install on fresh environment
        run: npm ci --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Tetris regression
        run: npm run check:tetris
      - name: Commit only corrected package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): synchronize npm lockfile for Cloudflare npm ci'
          git push origin HEAD:fix/cloudflare-npm-lock-2026-10-30
