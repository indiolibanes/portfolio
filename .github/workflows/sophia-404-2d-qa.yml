name: Sophia 404 2D scene QA
on:
  push:
    branches:
      - feat/404-sophia-2d-gameover-2026-10-30
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate six sprite assets and scripts
        run: |
          node --check src/scripts/sophia-room2d-temp.js
          node --check scripts/qa-sophia-404-2d.mjs
          for name in run play stress throw leave gamepad; do
            test -s "public/experimental/sophia-2d/sophia-2d-$name.webp"
          done
      - name: Astro build
        run: npm run build
      - name: Tetris regression
        run: npm run check:tetris
      - name: UX contract with known main baseline
        shell: bash
        run: |
          set +e
          npm run check:ux > /tmp/ux.log 2>&1
          code=$?
          set -e
          cat /tmp/ux.log
          if [ "$code" -eq 0 ]; then exit 0; fi
          actual=$(grep '^FAIL ' /tmp/ux.log || true)
          expected=$(printf '%s\n' 'FAIL nav: lab label aligned' 'FAIL nav: music static link' 'FAIL curiosidades: header link')
          test "$actual" = "$expected"
      - name: Browser setup
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Visual and interaction smoke
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4321/ > /dev/null && break
            sleep 1
          done
          node scripts/qa-sophia-404-2d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-2d-404-screenshots
          path: qa-results/sophia-404-2d/
          if-no-files-found: ignore
