name: Hsin Combat R2.1 (acting, rebake, anatomy gate kept, WebGL smoke, R2.0.1 vs R2.1 QA)

# three.js and sharp are installed from the lockfile here; the authoring workspace cannot reach the npm registry.
# Pose evidence is the CPU raster of the real GLB. The webgl job renders the real page in headless Chromium on SwiftShader:
# real WebGL for VFX, lighting, draw calls and errors, but never GPU frame time, FPS or artistic approval.
on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/hsin-combat-r21-*'

permissions:
  contents: write

concurrency:
  group: hsin-combat-r21-${{ github.ref }}
  cancel-in-progress: true

env:
  R2_BASE: 6227e1c6744c6cd7a46e366a3a6a71f294254c0c
  R201_HEAD: 4bd0475f7555cf4b670e6aa76c194ce0514e2e30

jobs:
  bake-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg (reference-ingestion regression test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Keep the R2.0.1 reference asset
        run: |
          mkdir -p qa
          git show $R201_HEAD:public/assets/animations/hsin/combat-r2.json > qa/combat-r201.json
          sha256sum qa/combat-r201.json | tee qa/r201.sha256
          cp docs/hsin-combat-r201/arm-anatomy-after.json qa/arm-anatomy-r201.json
      - name: Rebake R2.1
        id: bake
        shell: bash
        continue-on-error: true
        run: node scripts/bake-hsin-combat-r2.mjs 2>&1 | tee qa/bake.txt
      - name: R2.1 arms (every frame, real GLB)
        id: after
        if: steps.bake.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: node scripts/qa-hsin-combat-arms.mjs public/assets/animations/hsin/combat-r2.json qa/arm-anatomy-after.json R2.1 2>&1 | tee qa/arm-anatomy-after.txt
      - name: Anatomy gate, R2/R1 regressions, Hsin suite, build
        id: tests
        if: steps.bake.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e; f=0
          t(){ n=$1; shift; "$@" > qa/test-$n.txt 2>&1; c=$?; echo "$n exit $c" | tee -a qa/tests.txt; [ $c = 0 ] || f=1; }
          # The committed asset must be exactly what this bake produces (hash and bytes).
          t bake-deterministic git diff --exit-code -- public/assets/animations/hsin/combat-r2.json src/data/hsin-combat-r2.json
          t anatomy node tests/hsin-combat-r201-anatomy.test.mjs
          t acting node tests/hsin-combat-r21.test.mjs
          t combat-r2 node tests/hsin-combat-r2.test.mjs
          t combat-r2-screen node tests/hsin-combat-r2-screen.test.mjs
          t lab-r1 node tests/hsin-combat-lab.test.mjs
          t lab-r2 node tests/hsin-combat-lab.test.mjs --r2
          t reference-ingestion node tests/hsin-reference-ingestion.test.mjs
          t check-hsin npm run check:hsin
          t check npm run check
          t build npm run build
          # Contemplative acting, dance and the GLB are outside the Combat domain and must be byte-identical.
          t contemplative-untouched git diff --exit-code $R201_HEAD -- public/assets/models public/assets/animations/hsin/lunar-dance-r1.json public/assets/animations/hsin/lunar-dance-r2.json public/assets/animations/hsin/lunar-dance-r3.json public/assets/animations/hsin/lunar-dance-r3-grand.json src/scripts/hsin-cinematic-idle.mjs src/scripts/hsin-body-repertoire.mjs src/scripts/hsin-baked-pose.mjs src/scripts/hsin-lip-hair.mjs src/scripts/hsin-lunar-presentation.mjs
          exit $f
      - name: Collect
        if: always()
        run: |
          cp -r docs/hsin-combat-r21 qa/docs-hsin-combat-r21 2>/dev/null || true
          cp docs/hsin-combat-r2/structural-qa.json docs/hsin-combat-r2/screen-geometry-qa.json qa/ 2>/dev/null || true
          mkdir -p qa/assets && cp public/assets/animations/hsin/combat-r2.json src/data/hsin-combat-r2.json qa/assets/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hsin-combat-r21-bake, retention-days: 14, path: qa}
      - name: Publish evidence branch
        if: always()
        shell: bash
        run: |
          B=qa-results/hsin-combat-r211-bake; D=$(mktemp -d); cp -r qa/. $D/; cd $D
          printf 'source=%s\nrun=%s\nsha=%s\nbake=%s\nafter=%s\ntests=%s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.bake.outcome }}" "${{ steps.after.outcome }}" "${{ steps.tests.outcome }}" > SOURCE.txt
          git init -q; git checkout -q -b $B; git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Combat R2.1 bake evidence $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B
      - name: Gate
        if: steps.bake.outcome != 'success' || steps.after.outcome == 'failure' || steps.tests.outcome != 'success'
        run: |
          echo "bake=${{ steps.bake.outcome }} after=${{ steps.after.outcome }} tests=${{ steps.tests.outcome }}"; exit 1

  render:
    needs: bake-and-test
    if: always() && needs.bake-and-test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [sheets, closeups, video]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: {name: hsin-combat-r21-bake, path: qa}
      - name: Install ffmpeg
        if: matrix.part == 'video'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render ${{ matrix.part }}
        run: |
          mkdir -p out
          test -f qa/assets/combat-r2.json
          node scripts/render-hsin-combat-r21-qa.mjs qa/combat-r201.json qa/assets/combat-r2.json out --only=${{ matrix.part }} --workers=3
      - name: Publish evidence branch
        if: always()
        shell: bash
        run: |
          B=qa-results/hsin-combat-r211-${{ matrix.part }}; D=$(mktemp -d); cp -r out/. $D/ 2>/dev/null || true; cd $D
          printf 'source=%s\nrun=%s\nsha=%s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" > SOURCE.txt
          git init -q; git checkout -q -b $B; git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Combat R2.1 ${{ matrix.part }} $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B

  webgl:
    needs: bake-and-test
    if: always() && needs.bake-and-test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright (not saved to package.json)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build and serve the real site
        run: |
          npm run build
          npx astro preview --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/experimentos/combate/ >/dev/null && break; sleep 1; done
      - name: Real-WebGL run of the combat lab (SwiftShader)
        run: node scripts/qa/run-hsin-combat-webgl.mjs webgl-out --stage-url=http://127.0.0.1:4321 2>&1 | tee webgl-out.log
      - name: Encode the continuous capture (real WebGL, SwiftShader)
        if: always()
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in webgl-out/video-raw/*.webm; do [ -f "$f" ] || continue; ffmpeg -y -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p webgl-out/combat-r211-continuous-webgl.mp4; done
          ls -la webgl-out webgl-out/video-raw 2>/dev/null || true
      - name: Publish evidence branch
        if: always()
        shell: bash
        run: |
          B=qa-results/hsin-combat-r211-webgl; D=$(mktemp -d); cp -r webgl-out/. $D/ 2>/dev/null || true; cp webgl-out.log preview.log $D/ 2>/dev/null || true; cd $D
          printf 'source=%s\nrun=%s\nsha=%s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" > SOURCE.txt
          git init -q; git checkout -q -b $B; git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Combat R2.1 WebGL (SwiftShader) $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B
