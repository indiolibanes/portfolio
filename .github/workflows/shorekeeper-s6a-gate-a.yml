name: Shorekeeper S6-A Gate A (QA harness)
on:
  push:
    branches: ['qa/shorekeeper-s6a-gate-a-*']
permissions:
  contents: write
concurrency:
  group: sk-s6a-gate-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: npm}
      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Run gate commands
        shell: bash
        run: |
          set +e
          O=out/shorekeeper-s6a; mkdir -p $O
          { echo "sha=$GITHUB_SHA"; echo "run=$GITHUB_RUN_ID"; echo "base=5380f43533ac5db455f6d5a057fac5764dcd8a7c";
            echo "node=$(node -v)"; echo "npm=$(npm -v)"; echo "three=$(node --input-type=module -e "import * as T from 'three';console.log(T.REVISION)")";
            echo "diff_vs_base:"; git diff --stat 5380f43533ac5db455f6d5a057fac5764dcd8a7c HEAD; } > $O/env.txt
          run(){ n=$1; shift; "$@" > $O/$n.log 2>&1; echo $? > $O/$n.exit; echo "$n exit $(cat $O/$n.exit)"; }
          run shorekeeper node --test tests/shorekeeper*.test.mjs
          run node-all node --test tests/*.test.mjs
          run check npm run check
          run build npm run build
          run diff-check git diff --check 5380f43533ac5db455f6d5a057fac5764dcd8a7c
          S5C_REPO=$PWD run menu-contract node --test .qa-s6a/menu-contract.test.mjs
          S5C_REPO=$PWD run security-contract node --test .qa-s6a/security-contract.test.mjs
          run g7-harness node --test .qa-s6a/g7/g7-ab-mechanical.test.mjs .qa-s6a/g7/expected-manifest.test.mjs
          # dist hygiene: list GLB/large binaries in dist, robots meta in the sk page
          { find dist -iname '*.glb' -printf '%s %p\n'; echo "--- robots meta in dist/experimentos/sk:";
            grep -o '<meta name="robots"[^>]*>' dist/experimentos/sk/index.html 2>&1; } > $O/dist-hygiene.txt
          # unauthenticated HTTP (status + headers only, no credentials)
          P=https://170596cc.kaue.pages.dev
          for u in "/experimentos/sk/?r61=1&r62=s5" "/experimentos/sk/?r61=1&legacyQA=1" "/experimentos/sk/" "/api/shorekeeper/manifest" "/api/shorekeeper/asset?kind=library&id=basic" "/api/shorekeeper/diagnostics"; do
            echo "=== GET $P$u"; curl -sS -o /dev/null -D - --max-redirs 0 -A 'S6A-QA-unauthenticated-probe' "$P$u" | sed -E -e 's/(Set-Cookie: [^=]+=)[^;]*/\1<redacted>/I' -e 's/([?&](meta|kid)=)[^&[:space:]]*/\1<redacted>/g';
          done > $O/http-unauthenticated.txt 2>&1
          tail -n 25 $O/shorekeeper.log > $O/shorekeeper.tail; tail -n 25 $O/node-all.log > $O/node-all.tail
          exit 0
      - name: Publish logs to qa-results branch
        if: always()
        shell: bash
        run: |
          B=qa-results/shorekeeper-s6a-gate-a
          D=$(mktemp -d); cp -r out/shorekeeper-s6a $D/; cd $D
          printf 'source=%s\nrun=%s\nsha=%s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" > SOURCE.txt
          git init -q; git checkout -q -b $B; git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "S6-A Gate A logs from $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B
      - name: Gate
        shell: bash
        run: |
          f=0; for n in shorekeeper node-all check build diff-check menu-contract security-contract g7-harness; do c=$(cat out/shorekeeper-s6a/$n.exit); echo "$n=$c"; [ "$c" = 0 ] || f=1; done; exit $f
