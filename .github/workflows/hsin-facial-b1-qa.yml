name: Hsin acting and V2 stage regressions

on:
  push:
    branches:
      - 'experiment/hsin-facial-legibility-pass-b1-*'
      - 'experiment/hsin-v2-*'
      - 'experiment/hsin-v201-*'
      - 'experiment/hsin-lunar-dance-*'
  pull_request:
    paths:
      - 'src/scripts/hsin-*.mjs'
      - 'scripts/hsin-*.mjs'
      - 'src/scripts/hsin-*.ts'
      - 'src/data/hsin-*.json'
      - 'src/layouts/HsinStageLayout.astro'
      - 'src/styles/hsin-stage.css'
      - 'src/pages/experimentos/index.astro'
      - 'public/assets/characters/hsin/models/**'
      - 'public/assets/characters/hsin/animations/**'
      - 'scripts/bake-hsin-dance.mjs'
      - 'scripts/bench-hsin-dance.mjs'
      - 'scripts/render-hsin-dance-qa.mjs'
      - 'scripts/lib/hsin-dance-rig.mjs'
      - 'public/_headers'
      - 'public/assets/characters/hsin/scenes/**'
      - 'scripts/*hsin-v2*'
      - 'scripts/generate-hsin-moonlit.mjs'
      - 'scripts/render-hsin-poster.mjs'
      - 'scripts/qa/**'
      - 'scripts/lib/**'
      - 'scripts/solve-hsin-*.mjs'
      - 'scripts/bake-hsin-*.mjs'
      - 'scripts/bench-hsin-*.mjs'
      - 'scripts/data/**'
      - 'scripts/audit-hsin-materials.mjs'
      - 'docs/hsin-v201-material-audit.json'
      - 'public/_headers'
      - 'tests/hsin-*.test.mjs'
      - '.github/workflows/hsin-facial-b1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facial-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Facial Pass A / B / B.1 and autonomous presentation
        run: |
          node tests/hsin-face-acting.test.mjs
          node tests/hsin-face-pass-b.test.mjs
          node tests/hsin-face-b1.test.mjs
          node tests/hsin-b1-automation.test.mjs
          node tests/hsin-presence-expression.test.mjs
          node tests/hsin-autonomous-repertoire.test.mjs
          node tests/hsin-hair-gesture.test.mjs
          node tests/hsin-chest.test.mjs
          node tests/hsin-arm-roles.test.mjs
          node tests/hsin-left-arm-motion.test.mjs
          node tests/hsin-chest-director.test.mjs
          node tests/hsin-chest-rig.test.mjs
          node tests/hsin-presentation.test.mjs
          node tests/hsin-face-private.test.mjs
          node tests/hsin-motion-director.test.mjs
      - name: IK, rig, arm path and director regressions
        run: |
          node tests/hsin-gesture-ik.test.mjs
          node tests/hsin-acting-director.test.mjs
          node tests/hsin-arm-clearance.test.mjs
          node tests/hsin-waypoint-safety.test.mjs
          node tests/hsin-pose-transition.test.mjs
          node tests/hsin-embedded-texture.test.mjs
      - name: V2 player budgets and real production GLB
        run: |
          node tests/hsin-stage.test.mjs
          node tests/hsin-stage-asset.test.mjs
          node tests/hsin-moonlit-environment.test.mjs
          node tests/hsin-material-audit.test.mjs
          node tests/hsin-face-skin-math.test.mjs
          node tests/hsin-face-skin.test.mjs
          node tests/hsin-rig-parity.test.mjs
          node tests/hsin-lip-hair.test.mjs
          node tests/hsin-lip-touch-geometry.test.mjs
          node tests/hsin-hair-caress-geometry.test.mjs
          node tests/hsin-acting-runtime.test.mjs
          node tests/hsin-stage-metrics.test.mjs
          node scripts/bench-hsin-acting.mjs
      - name: Astro production build
        run: npm run build
      - name: UX contract
        run: npm run check:ux

  lunar-dance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Official provider contract and persistent pavilion
        run: |
          node tests/hsin-soundtrack.test.mjs
          node tests/hsin-music-state.test.mjs
          node tests/hsin-pavilion-r2.test.mjs
      - name: Dance ownership, geometry and deterministic 600-second sessions
        run: |
          node tests/hsin-dance.test.mjs
          node tests/hsin-dance-r2.test.mjs
          node tests/hsin-dance-geometry.test.mjs
          node tests/hsin-dance-geometry.test.mjs --r2
          node tests/hsin-stage.test.mjs
          node tests/hsin-stage-metrics.test.mjs
          node scripts/bench-hsin-dance.mjs
          node scripts/bench-hsin-dance.mjs --r2
      - name: Build, choreography integrity and UX
        run: |
          npm run build
          node --input-type=module -e "import{readFileSync}from'node:fs';import{createHash}from'node:crypto';const m=JSON.parse(readFileSync('src/data/hsin-dance.json'));if(createHash('sha256').update(readFileSync('dist'+m.url)).digest('hex')!==m.sha256)throw Error('Built choreography hash mismatch');"
          npm run check:ux
