name: Sync external portfolio assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-external-assets.yml

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install project dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Download external visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-assets

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://media1.tenor.com/m/BnIPE5qUprgAAAAC/luna-sailor-moon.gif"             -o /tmp/portfolio-assets/luna-sailor-moon.gif

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://media1.tenor.com/m/-fsSXGol-1AAAAAC/type-typing.gif"             -o /tmp/portfolio-assets/typing-left.gif

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://media1.tenor.com/m/Jn2gJceZAAYAAAAC/type-typing.gif"             -o /tmp/portfolio-assets/typing-right.gif

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://media1.tenor.com/m/gb2xC6a_UZgAAAAC/violet-evergarden-violet.gif"             -o /tmp/portfolio-assets/violet-evergarden.gif

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://images1.penguinrandomhouse.com/cover/9781101984253"             -o /tmp/portfolio-assets/the-big-picture-cover.jpg

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://cdn.pixabay.com/photo/2015/07/15/20/08/paris-846873_1280.jpg"             -o /tmp/portfolio-assets/e-se-paris.jpg

          curl -fL --retry 3 -A "Mozilla/5.0"             "https://avatars.githubusercontent.com/u/32935701?v=4"             -o /tmp/portfolio-assets/github-avatar

      - name: Optimize local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets

          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { copyFile, rm } from 'node:fs/promises';

          const animated = [
            ['luna-sailor-moon.gif', 'luna-sailor-moon.webp'],
            ['typing-left.gif', 'typing-left.webp'],
            ['typing-right.gif', 'typing-right.webp'],
            ['violet-evergarden.gif', 'violet-evergarden.webp'],
          ];

          for (const [input, output] of animated) {
            await sharp('/tmp/portfolio-assets/' + input, {
              animated: true,
              limitInputPixels: false,
            })
              .webp({
                quality: 80,
                effort: 3,
              })
              .toFile('public/assets/' + output);
          }

          await sharp('/tmp/portfolio-assets/github-avatar', {
            limitInputPixels: false,
          })
            .resize(256, 256, {
              fit: 'cover',
              withoutEnlargement: true,
            })
            .webp({
              quality: 86,
              effort: 4,
            })
            .toFile('public/assets/github-avatar.webp');

          await sharp('/tmp/portfolio-assets/the-big-picture-cover.jpg')
            .resize({
              width: 600,
              withoutEnlargement: true,
            })
            .jpeg({
              quality: 88,
              progressive: true,
            })
            .toFile('public/assets/the-big-picture-cover.jpg');

          await sharp('/tmp/portfolio-assets/e-se-paris.jpg')
            .resize({
              width: 1280,
              withoutEnlargement: true,
            })
            .jpeg({
              quality: 86,
              progressive: true,
            })
            .toFile('public/assets/e-se-paris.jpg');

          for (const oldAsset of [
            'luna-sailor-moon.gif',
            'typing-left.gif',
            'typing-right.gif',
            'violet-evergarden.gif',
            'github-avatar.png',
          ]) {
            await rm('public/assets/' + oldAsset, {
              force: true,
            });
          }
          NODE

          du -h public/assets/*

      - name: Point portfolio to optimized local assets
        shell: python
        run: |
          from pathlib import Path

          index = Path("src/pages/index.astro")
          content = index.read_text(encoding="utf-8")

          replacements = {
              "https://media1.tenor.com/m/BnIPE5qUprgAAAAC/luna-sailor-moon.gif": "/assets/luna-sailor-moon.webp",
              "/assets/luna-sailor-moon.gif": "/assets/luna-sailor-moon.webp",
              "https://media1.tenor.com/m/-fsSXGol-1AAAAAC/type-typing.gif": "/assets/typing-left.webp",
              "/assets/typing-left.gif": "/assets/typing-left.webp",
              "https://media1.tenor.com/m/Jn2gJceZAAYAAAAC/type-typing.gif": "/assets/typing-right.webp",
              "/assets/typing-right.gif": "/assets/typing-right.webp",
              "https://media1.tenor.com/m/gb2xC6a_UZgAAAAC/violet-evergarden-violet.gif": "/assets/violet-evergarden.webp",
              "/assets/violet-evergarden.gif": "/assets/violet-evergarden.webp",
              "https://images1.penguinrandomhouse.com/cover/9781101984253": "/assets/the-big-picture-cover.jpg",
              "https://cdn.pixabay.com/photo/2015/07/15/20/08/paris-846873_1280.jpg": "/assets/e-se-paris.jpg",
          }

          for old, new in replacements.items():
              content = content.replace(old, new)

          index.write_text(content, encoding="utf-8")

          config = Path("src/config.ts")
          content = config.read_text(encoding="utf-8")

          for old in (
              "https://avatars.githubusercontent.com/u/32935701?v=4",
              "/assets/github-avatar.png",
          ):
              content = content.replace(
                  old,
                  "/assets/github-avatar.webp",
              )

          config.write_text(content, encoding="utf-8")

      - name: Validate production build
        shell: bash
        run: |
          npm run build

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/assets src/pages/index.astro src/config.ts

          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi

          git commit -m "perf: optimize locally served portfolio visuals"
          git push
