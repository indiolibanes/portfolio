name: Shorekeeper F1.6 synthetic
on:
  pull_request:
    paths:
      - 'tests/shorekeeper-f16/**'
      - '.github/workflows/shorekeeper-f16.yml'
  push:
    paths:
      - 'tests/shorekeeper-f16/**'
      - '.github/workflows/shorekeeper-f16.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/shorekeeper-f16/synthetic-test.mjs
