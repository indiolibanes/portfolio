<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Shorekeeper F1.6 — teste local</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#101923;color:#edf4fa;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}#canvas{height:calc(100vh - 165px);min-height:350px}canvas{display:block}p{margin:5px 12px;color:#b8c7d7}label{display:flex;gap:5px;align-items:center}</style><script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script></head><body><header><label>GLB privado <input type="file" id="file" accept=".glb,model/gltf-binary"></label><button id="front">Frente</button><button id="threequarter">3/4</button><button id="profile">Perfil</button><button id="face">Rosto</button><button id="gesture">Gesto</button><button id="interrupt">Interromper</button><button id="pause">Pausar</button><label>Fechar <input id="blink" type="range" min="0" max="1" step="0.25" value="0"><output id="weight">0</output></label><label>Olhar <select id="pupil"><option value="">Neutro</option><option>Pupil_L</option><option>Pupil_R</option><option>Pupil_Up</option><option>Pupil_Down</option></select></label><label>Intensidade <input id="gaze" type="range" min="0" max="1" step="0.05" value="0.5"></label><label>Material <select id="material"><option value="original">Original</option><option value="mask">Bangs/Alpha: MASK experimental</option></select></label></header><p id="status">Escolha o GLB privado. Nenhum upload é feito pelo viewer; mantenha o servidor ligado somente à interface local.</p><div id="canvas"></div><p>Experimento: a camada secundária para no último quadro; pausa, órbita, zoom e mudança de vista são locais. Não representa o shader original.</p>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createDirector} from './director.mjs';
const $=id=>document.getElementById(id),host=$('canvas');let renderer;try{const canvas=document.createElement('canvas'),context=canvas.getContext('webgl2');if(!context)throw Error('WebGL2 indisponível');renderer=new T.WebGLRenderer({canvas,context,antialias:true});}catch(e){$('status').textContent=e.message;throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x202c39);scene.add(new T.HemisphereLight(0xe2efff,0x33313c,2));const key=new T.DirectionalLight(0xffffff,2);key.position.set(2,4,4);scene.add(key);const camera=new T.PerspectiveCamera(35,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);let model=null,director=null,morphs=[],materialState=[],center=new T.Vector3(0,1,0),size=2,paused=false;function resize(){const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();function view(angle,face=false){let target=center.clone();if(face)target.y+=size*.31;let dist=face?size*.58:size*2.3;controls.target.copy(target);camera.position.set(target.x+Math.sin(angle)*dist,target.y,target.z+Math.cos(angle)*dist);camera.near=Math.max(.01,dist/100);camera.far=dist*20;camera.updateProjectionMatrix();controls.update()};function dispose(){director?.dispose();director=null;if(!model)return;scene.remove(model);const geo=new Set(),mat=new Set(),tex=new Set(),sk=new Set();model.traverse(o=>{if(!o.isMesh)return;geo.add(o.geometry);if(o.skeleton)sk.add(o.skeleton);for(const m of Array.isArray(o.material)?o.material:[o.material]){mat.add(m);for(const v of Object.values(m))if(v?.isTexture)tex.add(v)}});for(const s of sk)s.dispose();for(const t of tex){t.dispose();t.image?.close?.()}for(const m of mat)m.dispose();for(const g of geo)g.dispose();model=null}
$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;dispose();const data=await f.arrayBuffer(),g=await new GLTFLoader().parseAsync(data,'');model=g.scene;scene.add(model);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model);center=box.getCenter(new T.Vector3());size=Math.max(...box.getSize(new T.Vector3()).toArray());morphs=[];materialState=[];model.traverse(o=>{if(o.morphTargetDictionary)morphs.push(o);for(const m of o.material?(Array.isArray(o.material)?o.material:[o.material]):[]){if(/Bangs|Alpha/i.test(m.name))materialState.push({m,transparent:m.transparent,alphaTest:m.alphaTest,depthWrite:m.depthWrite})}});const body=g.animations.find(c=>c.name==='Stand1_Action01_window'),cloth=g.animations.find(c=>c.name==='Rib_Stand1_ClothLayer');if(body&&cloth)director=createDirector(T,model,body,cloth);paused=false;view(0);$('status').textContent='Arquivo local carregado: '+f.name+'; '+g.animations.length+' clipes. Inspeção visual ainda requer avaliação humana.';apply()}catch(err){$('status').textContent='Erro: '+err.message;console.error(err)}};
function apply(){for(const o of morphs){for(const n of ['E_Close','Pupil_L','Pupil_R','Pupil_Up','Pupil_Down']){const i=o.morphTargetDictionary[n];if(i!==undefined)o.morphTargetInfluences[i]=n==='E_Close'?Number($('blink').value):n===$('pupil').value?Number($('gaze').value):0}}$('weight').textContent=$('blink').value;for(const x of materialState){x.m.transparent=x.transparent;x.m.alphaTest=$('material').value==='mask'?.5:x.alphaTest;x.m.depthWrite=x.depthWrite;x.m.needsUpdate=true}}for(const id of ['blink','pupil','gaze','material'])$(id).oninput=apply;$('front').onclick=()=>view(0);$('threequarter').onclick=()=>view(Math.PI/4);$('profile').onclick=()=>view(Math.PI/2);$('face').onclick=()=>view(0,true);$('gesture').onclick=()=>director?.start();$('interrupt').onclick=()=>director?.interrupt();$('pause').onclick=()=>{paused=!paused;director?.setPaused(paused);$('pause').textContent=paused?'Retomar':'Pausar'};let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;director?.advance(dt);controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);window.addEventListener('pagehide',()=>{dispose();controls.dispose();renderer.dispose()},{once:true});
</script></body></html>
