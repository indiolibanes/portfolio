<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorekeeper · QA facial privado</title><style>body{margin:0;font:15px system-ui;background:#f4f9fd;color:#29465d}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh}#viewport{position:relative;min-height:55vh}aside{padding:1rem;overflow:auto;background:white}label{display:block;margin:.8rem 0}button,select,input{font:inherit;max-width:100%;padding:.5rem}button{min-height:44px}canvas{width:100%;height:100%;display:block}.row{display:flex;gap:.5rem;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}#viewport{height:55vh}aside{max-height:45vh}}</style></head><body><main><div id="viewport"></div><aside><h1>QA facial privado</h1><p>Selecione o GLB local. Nenhum arquivo é enviado. Experimentos sem aprovação visual.</p><label>Modelo local<input type="file" id="file" accept=".glb,model/gltf-binary"></label><label>Experimento<select id="candidate"></select></label><label>Etapa<select id="component"></select></label><label>Intensidade<select id="amount"><option value="0">0%</option><option value=".25">25%</option><option value=".5">50%</option><option value=".75">75%</option><option value="1">100%</option></select></label><div class="row"><button data-view="front">Frontal</button><button data-view="quarter">¾</button><button data-view="face">Rosto</button><button id="save">Salvar PNG local</button></div><pre id="status">Aguardando WebGL2 e GLB.</pre></aside></main><script type="module" src="./qa.mjs"></script></body></html>
