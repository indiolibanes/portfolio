<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 448 448" width="448" height="448" role="img" aria-labelledby="title description">
  <title id="title">Crimson Baton da Phrolova — estudo vetorial estático</title>
  <desc id="description">Traçado manual da ilustração public/phrolova-baton.webp. Haste, junção, coroas de pétalas recurvadas, estames e música são grupos independentes. Sem imagens raster, laços inventados ou animação. As superfícies encobertas permanecem simplificadas; fotografias indexadas indisponíveis nesta revisão.</desc>
  <metadata>Draft 01, 2026-10-08. Source: indiolibanes/portfolio public/phrolova-baton.webp, blob fc2218dbd2fc53ec2559b40b8db7da65b8dc788f. Original game artwork: Kuro Games / Wuthering Waves. Manually authored Bezier paths, source coordinate system 448 x 448. Not Lethean Elegy. Geometry approval pending.</metadata>
