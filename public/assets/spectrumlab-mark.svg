<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">SPECTRUM-LAB PRO</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A08"/>
      <stop offset="1" stop-color="#1C1810"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1D27A"/>
      <stop offset="1" stop-color="#B8912E"/>
    </linearGradient>
  </defs>
  <!-- Contorno arredondado da marca -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.7" stroke-width="2"/>
  <!-- Seis canais espectrais (610 a 860 nm), como no gráfico da abertura -->
  <line x1="22" y1="100" x2="106" y2="100" stroke="#4A3D22" stroke-width="2" stroke-linecap="round"/>
  <g fill="url(#bar)" fill-opacity="0.85">
    <rect x="24" y="76" width="9" height="24" rx="3"/>
    <rect x="38" y="68" width="9" height="32" rx="3"/>
    <rect x="52" y="62" width="9" height="38" rx="3"/>
    <rect x="66" y="58" width="9" height="42" rx="3"/>
    <rect x="80" y="54" width="9" height="46" rx="3"/>
    <rect x="94" y="50" width="9" height="50" rx="3"/>
  </g>
  <!-- Curva espectral sobre as barras -->
  <polyline points="28.5,76 42.5,68 56.5,62 70.5,58 84.5,54 98.5,50" fill="none" stroke="#F4EAD2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F4EAD2">
    <circle cx="28.5" cy="76" r="3.5"/>
    <circle cx="42.5" cy="68" r="3.5"/>
    <circle cx="56.5" cy="62" r="3.5"/>
    <circle cx="70.5" cy="58" r="3.5"/>
    <circle cx="84.5" cy="54" r="3.5"/>
    <circle cx="98.5" cy="50" r="3.5"/>
  </g>
</svg>
